# Example caller for the standalone full-history secrets stage.
name: Sample - secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/secrets-security-scans.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # nested scanner requests SARIF scope even when upload-sarif is false
    with:
      artifact-prefix: sample-secrets

# Infrastructure-as-code scanning stage; triggering is owned by the caller.
name: Terraform security scans

on:
  workflow_call:
    inputs:
      working-directory:
        description: "IaC directory relative to the repository root; history scans cover the whole repository."
        type: string
        default: "."
      artifact-prefix:
        description: "Unique artifact prefix for this stage; do not reuse it for another profile in the same run."
        type: string
        default: "stage-tf"

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/profile-tf.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # nested scanner requests SARIF scope even when upload-sarif is false
    with:
      working-directory: ${{ inputs.working-directory }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      upload-sarif: false

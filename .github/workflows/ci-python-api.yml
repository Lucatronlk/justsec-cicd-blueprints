# App-specific entrypoint: python-api. Image and full run only on manual dispatch.
name: CI - python-api
on:
  push:
    paths:
      - 'apps/python-api/**'
  pull_request:
    paths:
      - 'apps/python-api/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Scan profile
        type: choice
        required: true
        default: dev
        options:
          - dev
          - pr
          - full
          - image
permissions:
  contents: read
concurrency:
  group: ci-python-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dev:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'dev') }}
    uses: ./.github/workflows/profile-dev.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab needs it.
    with:
      working-directory: apps/python-api
      artifact-prefix: python-api-dev
      upload-sarif: false
  pr:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'pr') }}
    uses: ./.github/workflows/profile-pr-gate.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab needs it.
    with:
      working-directory: apps/python-api
      artifact-prefix: python-api-pr
      upload-sarif: false
  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' }}
    uses: ./.github/workflows/profile-full.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab needs it.
    with:
      working-directory: apps/python-api
      artifact-prefix: python-api-full
      upload-sarif: false
      dockerfile: apps/python-api/Dockerfile
      docker-context: apps/python-api
  image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'image' }}
    uses: ./.github/workflows/profile-image.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab needs it.
    with:
      dockerfile: apps/python-api/Dockerfile
      artifact-prefix: python-api-image
      upload-sarif: false
      docker-context: apps/python-api

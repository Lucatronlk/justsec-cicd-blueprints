# Secret scan with gitleaks over the full git history (or a directory).
#
# Call it from a repository with:
#
#   jobs:
#     gitleaks:
#       uses: Lucatronlk/justsec-cicd-blueprints/.github/workflows/scan-gitleaks.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#
# Report-only: it never fails on a finding, only when the scanner itself
# cannot run. The report is uploaded as an artifact for security-gate.yml,
# which makes the one pass/fail decision (the profile-*.yml workflows wire
# the two together). The scanner is pinned: a binary by version and SHA-256,
# an image by digest. Values a caller passes reach the shell through env:.

name: Scan - gitleaks

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to scan, relative to the repository root."
        type: string
        default: "."
      artifact-name:
        description: "Name of the artifact the report is uploaded as. Unique per workflow run; the gate downloads by prefix."
        type: string
        default: "scan-gitleaks"
      retention-days:
        description: "Days the report artifact is kept."
        type: number
        default: 14
      upload-sarif:
        description: "Upload SARIF to the repository's code scanning (needs a public repository or GitHub Advanced Security). The gate never depends on it."
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`."
        type: string
        default: "audit"
      allowed-endpoints:
        description: "harden-runner allow-list for `block`, space-separated host:port entries. The default is what this scan reaches; the runner's own infrastructure needs no entry."
        type: string
        default: "api.github.com:443 github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443"
      extra-allowed-endpoints:
        description: "Appended to `allowed-endpoints`, for hosts only this repository needs. Same format."
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout."
        type: number
        default: 20
      gitleaks-version:
        description: "gitleaks release to download (gitleaks/gitleaks), without the `v`."
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: "SHA-256 of the gitleaks linux_x64 tarball for that version."
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      gitleaks-mode:
        description: "`git` scans the whole history of the repository; `dir` scans the files under `working-directory` only."
        type: string
        default: "git"
      gitleaks-args:
        description: "Extra gitleaks arguments, e.g. `--config .gitleaks.toml`."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # the SARIF upload, a view in the Security tab
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks at the pinned version
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.download "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.download" | sha256sum -c -
          tar -xzf /tmp/gitleaks.download -C /tmp gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          install -m 0755 /tmp/gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Prepare the report directories
        run: mkdir -p "$RUNNER_TEMP/scan-results" "$RUNNER_TEMP/sarif"

      - name: gitleaks
        env:
          MODE: ${{ inputs.gitleaks-mode }}
          DIR: ${{ inputs.working-directory }}
          ARGS: ${{ inputs.gitleaks-args }}
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          case "$MODE" in
            git) target=(git .) ;;
            dir) target=(dir "$DIR") ;;
            *) echo "::error::gitleaks-mode must be git or dir, got '$MODE'"; exit 2 ;;
          esac
          # --redact keeps the secret itself out of both reports.
          for fmt in json sarif; do
            case "$fmt" in json) out="$RUNNER_TEMP/scan-results/gitleaks.json" ;; sarif) out="$RUNNER_TEMP/sarif/gitleaks.sarif" ;; esac
            gitleaks "${target[@]}" --redact --no-banner --exit-code 0 \
              --report-format "$fmt" --report-path "$out" "${args[@]}"
          done

      - name: Upload the report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/scan-results/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # hashFiles() only sees the workspace, so presence is checked here.
      - name: Find the SARIF files
        id: sarif
        if: inputs.upload-sarif
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/sarif/*.sarif; do
            [ -s "$f" ] || continue
            name=$(basename "$f" .sarif)
            echo "${name//-/_}=true" >> "$GITHUB_OUTPUT"
          done

      # A view in the Security tab, not the decision: a private repository
      # without Advanced Security, or a fork's pull request, cannot upload,
      # and the gate does not need it to.

      - name: Upload SARIF (gitleaks.sarif)
        if: inputs.upload-sarif && steps.sarif.outputs.gitleaks == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/gitleaks.sarif
          category: ${{ inputs.artifact-name }}

# Full-history, repository-wide secret scanning, including standalone runs.
name: Secrets security scans

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: "Unique artifact prefix for this stage; do not reuse it for another profile in the same run."
        type: string
        default: "stage-secrets"

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/profile-secrets.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # nested scanner requests SARIF scope even when upload-sarif is false
    with:
      artifact-prefix: ${{ inputs.artifact-prefix || 'stage-secrets' }}
      upload-sarif: false

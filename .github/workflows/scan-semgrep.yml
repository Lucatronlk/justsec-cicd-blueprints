# Static analysis (SAST) with Semgrep, from the pinned image, metrics off.
#
# Call it from a repository with:
#
#   jobs:
#     semgrep:
#       uses: Lucatronlk/justsec-cicd-blueprints/.github/workflows/scan-semgrep.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#
# Report-only: it never fails on a finding, only when the scanner itself
# cannot run. The report is uploaded as an artifact for security-gate.yml,
# which makes the one pass/fail decision (the profile-*.yml workflows wire
# the two together). The scanner is pinned: a binary by version and SHA-256,
# an image by digest. Values a caller passes reach the shell through env:.

name: Scan - Semgrep (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to scan, relative to the repository root."
        type: string
        default: "."
      artifact-name:
        description: "Name of the artifact the report is uploaded as. Unique per workflow run; the gate downloads by prefix."
        type: string
        default: "scan-semgrep"
      retention-days:
        description: "Days the report artifact is kept."
        type: number
        default: 14
      upload-sarif:
        description: "Upload SARIF to the repository's code scanning (needs a public repository or GitHub Advanced Security). The gate never depends on it."
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`."
        type: string
        default: "audit"
      allowed-endpoints:
        description: "harden-runner allow-list for `block`, space-separated host:port entries. The default is what this scan reaches; the runner's own infrastructure needs no entry."
        type: string
        default: "api.github.com:443 auth.docker.io:443 github.com:443 objects.githubusercontent.com:443 production.cloudfront.docker.com:443 registry-1.docker.io:443 release-assets.githubusercontent.com:443 semgrep.dev:443"
      extra-allowed-endpoints:
        description: "Appended to `allowed-endpoints`, for hosts only this repository needs. Same format."
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout."
        type: number
        default: 20
      semgrep-image:
        description: "Semgrep container image, pinned by digest."
        type: string
        default: "semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b"
      semgrep-config:
        description: "Space-separated Semgrep rule sets or rule files, e.g. `p/default p/owasp-top-ten` or `.semgrep.yml`."
        type: string
        default: "p/default"
      semgrep-args:
        description: "Extra semgrep arguments, e.g. `--exclude tests`."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # the SARIF upload, a view in the Security tab
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the report directories
        run: mkdir -p "$RUNNER_TEMP/scan-results" "$RUNNER_TEMP/sarif"

      - name: semgrep
        env:
          IMAGE: ${{ inputs.semgrep-image }}
          CONFIG: ${{ inputs.semgrep-config }}
          DIR: ${{ inputs.working-directory }}
          ARGS: ${{ inputs.semgrep-args }}
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          configs=()
          for c in $CONFIG; do configs+=(--config "$c"); done
          # As the runner's user, so git inside the container trusts the checkout.
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" -w /src "$IMAGE" \
            semgrep scan "${configs[@]}" --metrics=off --quiet \
              --json-output=/out/scan-results/semgrep.json --sarif-output=/out/sarif/semgrep.sarif \
              "${args[@]}" "$DIR" > /dev/null

      - name: Upload the report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/scan-results/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # hashFiles() only sees the workspace, so presence is checked here.
      - name: Find the SARIF files
        id: sarif
        if: inputs.upload-sarif
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/sarif/*.sarif; do
            [ -s "$f" ] || continue
            name=$(basename "$f" .sarif)
            echo "${name//-/_}=true" >> "$GITHUB_OUTPUT"
          done

      # A view in the Security tab, not the decision: a private repository
      # without Advanced Security, or a fork's pull request, cannot upload,
      # and the gate does not need it to.

      - name: Upload SARIF (semgrep.sarif)
        if: inputs.upload-sarif && steps.sarif.outputs.semgrep == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/semgrep.sarif
          category: ${{ inputs.artifact-name }}

# Fast feedback stage. The local profile resolves from the same revision as this wrapper.
name: Dev security scan

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to scan relative to the repository root; history scans cover the whole repository."
        type: string
        default: "."
      artifact-prefix:
        description: "Unique artifact prefix for this stage; do not reuse it for another profile in the same run."
        type: string
        default: "stage-dev"

permissions:
  contents: read

jobs:
  scan:
    uses: ./.github/workflows/profile-dev.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # nested scanner requests SARIF scope even when upload-sarif is false
    with:
      working-directory: ${{ inputs.working-directory }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      upload-sarif: false

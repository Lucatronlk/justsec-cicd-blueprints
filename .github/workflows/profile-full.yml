# Everything: secrets (gitleaks), code (Semgrep), dependencies (Trivy,
# osv-scanner), infrastructure as code (Trivy config, Checkov), Dockerfiles
# (hadolint) and the image (Trivy, Grype) when one is named, then the gate. For
# the default branch and a weekly schedule; profile-pr-gate.yml is the
# per-change check.
#
# Call it from a repository with:
#
#   jobs:
#     full:
#       uses: Lucatronlk/justsec-cicd-blueprints/.github/workflows/profile-full.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         dockerfile: Dockerfile
#
# Branch protection requires `full / Security gate / Security gate`. Every
# scan is report-only; the gate is the one decision (CRITICAL and HIGH fail by
# default, on every branch). See README.md "Security scans".

name: Profile - full (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to scan, relative to the repository root. The gitleaks history scan always covers the whole repository."
        type: string
        default: "."
      artifact-prefix:
        description: "Prefix of this profile's artifacts and SARIF categories. Give each profile a caller runs in one workflow its own, none a prefix of another."
        type: string
        default: "full"
      fail-on:
        description: "Comma-separated severities that fail the gate, or `none` to report only."
        type: string
        default: "CRITICAL,HIGH"
      fail-on-secrets:
        description: "Fail on every secret finding whatever its severity, unverified ones included."
        type: boolean
        default: false
      exceptions-file:
        description: "Exceptions file in the calling repository."
        type: string
        default: ".github/security-exceptions.yml"
      checkov-default-severity:
        description: "Severity given to Checkov findings that carry none."
        type: string
        default: "MEDIUM"
      semgrep-config:
        description: "Space-separated Semgrep rule sets or rule files."
        type: string
        default: "p/default"
      upload-sarif:
        description: "Upload SARIF to code scanning (public repository or GitHub Advanced Security)."
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only each job's measured list."
        type: string
        default: "audit"
      extra-allowed-endpoints:
        description: "Hosts added to every job's allow-list, space-separated host:port. Same format as `allowed-endpoints`."
        type: string
        default: ""
      image:
        description: "Image reference to scan; with `dockerfile` empty too, no image is scanned."
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile to build and scan; empty with `image` empty skips the image scan."
        type: string
        default: ""
      docker-context:
        description: "Build context for `dockerfile`."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/scan-gitleaks.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-gitleaks
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}

  semgrep:
    uses: ./.github/workflows/scan-semgrep.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-semgrep
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}
      semgrep-config: ${{ inputs.semgrep-config }}

  trivy:
    uses: ./.github/workflows/scan-trivy.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-trivy-fs
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}
      trivy-scanners: vuln,secret

  trivy-config:
    uses: ./.github/workflows/scan-trivy.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-trivy-config
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}
      trivy-mode: config

  osv-scanner:
    uses: ./.github/workflows/scan-osv-scanner.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-osv-scanner
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}

  checkov:
    uses: ./.github/workflows/scan-checkov.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-checkov
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}

  hadolint:
    uses: ./.github/workflows/scan-hadolint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-hadolint
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      working-directory: ${{ inputs.working-directory }}

  image:
    if: inputs.dockerfile != '' || inputs.image != ''
    uses: ./.github/workflows/scan-image.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # SARIF to the Security tab
    with:
      artifact-name: ${{ inputs.artifact-prefix }}-image
      upload-sarif: ${{ inputs.upload-sarif }}
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      image: ${{ inputs.image }}
      dockerfile: ${{ inputs.dockerfile }}
      docker-context: ${{ inputs.docker-context }}

  gate:
    name: Security gate
    if: always()
    needs: [gitleaks, semgrep, trivy, trivy-config, osv-scanner, checkov, hadolint, image]
    uses: ./.github/workflows/security-gate.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      artifact-prefix: ${{ inputs.artifact-prefix }}
      fail-on: ${{ inputs.fail-on }}
      fail-on-secrets: ${{ inputs.fail-on-secrets }}
      exceptions-file: ${{ inputs.exceptions-file }}
      upstream-results: ${{ join(needs.*.result, ',') }}
      expected-reports: gitleaks,semgrep,trivy-fs,trivy-config,osv-scanner,checkov,hadolint,trivy-image,grype
      egress-policy: ${{ inputs.egress-policy }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      checkov-default-severity: ${{ inputs.checkov-default-severity }}

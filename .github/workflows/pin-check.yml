# Detect scanner tool pins that have drifted stale. Dependabot moves the
# action SHAs but not the <tool>-version / <tool>-sha256 inputs the scan
# workflows pin each CLI with, so this scheduled job asks the GitHub API for
# each tool's latest release and fails when a pinned version is behind it.
name: Pin check

on:
  workflow_dispatch:

# One pin check at a time: two dispatches would duplicate the release lookups.
concurrency:
  group: pin-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Scanner pins current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check scanner pins
        run: python scripts/check_scanner_pins.py --stale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

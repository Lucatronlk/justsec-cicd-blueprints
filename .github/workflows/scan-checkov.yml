# Infrastructure-as-code policy scan with Checkov (Terraform, Kubernetes,
# Helm, Dockerfile, CloudFormation, ...), from the pinned image.
# Without a Prisma Cloud key its checks carry no severity; the gate gives them
# its `checkov-default-severity` (MEDIUM: reported, not blocking).
#
# Call it from a repository with:
#
#   jobs:
#     checkov:
#       uses: Lucatronlk/justsec-cicd-blueprints/.github/workflows/scan-checkov.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#
# Report-only: it never fails on a finding, only when the scanner itself
# cannot run. The report is uploaded as an artifact for security-gate.yml,
# which makes the one pass/fail decision (the profile-*.yml workflows wire
# the two together). The scanner is pinned: a binary by version and SHA-256,
# an image by digest. Values a caller passes reach the shell through env:.

name: Scan - Checkov (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to scan, relative to the repository root."
        type: string
        default: "."
      artifact-name:
        description: "Name of the artifact the report is uploaded as. Unique per workflow run; the gate downloads by prefix."
        type: string
        default: "scan-checkov"
      retention-days:
        description: "Days the report artifact is kept."
        type: number
        default: 14
      upload-sarif:
        description: "Upload SARIF to the repository's code scanning (needs a public repository or GitHub Advanced Security). The gate never depends on it."
        type: boolean
        default: true
      egress-policy:
        description: "harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`."
        type: string
        default: "audit"
      allowed-endpoints:
        description: "harden-runner allow-list for `block`, space-separated host:port entries. The default is what this scan reaches; the runner's own infrastructure needs no entry."
        type: string
        default: "api.github.com:443 auth.docker.io:443 github.com:443 objects.githubusercontent.com:443 production.cloudfront.docker.com:443 registry-1.docker.io:443 release-assets.githubusercontent.com:443"
      extra-allowed-endpoints:
        description: "Appended to `allowed-endpoints`, for hosts only this repository needs. Same format."
        type: string
        default: ""
      timeout-minutes:
        description: "Job timeout."
        type: number
        default: 20
      checkov-image:
        description: "Checkov container image, pinned by digest."
        type: string
        default: "bridgecrew/checkov@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53"
      checkov-frameworks:
        description: "Comma-separated frameworks, e.g. `terraform,kubernetes,helm,dockerfile`; empty scans all."
        type: string
        default: ""
      checkov-skip-paths:
        description: "Comma-separated paths (regular expressions) Checkov skips."
        type: string
        default: ".terraform,.terragrunt-cache,node_modules"
      checkov-args:
        description: "Extra Checkov arguments, e.g. `--skip-check CKV_AWS_18`."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: checkov
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # the SARIF upload, a view in the Security tab
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the report directories
        run: mkdir -p "$RUNNER_TEMP/scan-results" "$RUNNER_TEMP/sarif"

      - name: checkov
        env:
          IMAGE: ${{ inputs.checkov-image }}
          FRAMEWORKS: ${{ inputs.checkov-frameworks }}
          SKIP: ${{ inputs.checkov-skip-paths }}
          DIR: ${{ inputs.working-directory }}
          ARGS: ${{ inputs.checkov-args }}
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          if [ -n "$FRAMEWORKS" ]; then args+=(--framework "$FRAMEWORKS"); fi
          IFS=',' read -r -a skips <<< "$SKIP"
          for s in "${skips[@]}"; do [ -n "$s" ] && args+=(--skip-path "$s"); done
          mkdir -p "$RUNNER_TEMP/checkov"
          # --skip-download: no call to the Prisma Cloud platform; no API key here.
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/checkov:/out" -w /src "$IMAGE" \
            -d "$DIR" --skip-download --soft-fail --compact --quiet \
            -o json -o sarif --output-file-path /out "${args[@]}" > /dev/null
          mv "$RUNNER_TEMP/checkov/results_json.json" "$RUNNER_TEMP/scan-results/checkov.json"
          if [ -f "$RUNNER_TEMP/checkov/results_sarif.sarif" ]; then
            mv "$RUNNER_TEMP/checkov/results_sarif.sarif" "$RUNNER_TEMP/sarif/checkov.sarif"
          fi

      - name: Upload the report for the gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/scan-results/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # hashFiles() only sees the workspace, so presence is checked here.
      - name: Find the SARIF files
        id: sarif
        if: inputs.upload-sarif
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP"/sarif/*.sarif; do
            [ -s "$f" ] || continue
            name=$(basename "$f" .sarif)
            echo "${name//-/_}=true" >> "$GITHUB_OUTPUT"
          done

      # A view in the Security tab, not the decision: a private repository
      # without Advanced Security, or a fork's pull request, cannot upload,
      # and the gate does not need it to.

      - name: Upload SARIF (checkov.sarif)
        if: inputs.upload-sarif && steps.sarif.outputs.checkov == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/sarif/checkov.sarif
          category: ${{ inputs.artifact-name }}

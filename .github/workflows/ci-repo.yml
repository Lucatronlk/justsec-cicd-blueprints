# Repository library checks; independent of app path filters.
name: CI - repository
on:
  push:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'scan-targets.json'
      - 'Dockerfile*'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'scan-targets.json'
      - 'Dockerfile*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-repo-${{ github.ref }}
  cancel-in-progress: true
# Every run: step is a bash script. A runner may start a step in a different
# working directory than the checkout, so no step may rely on `pwd`.
defaults:
  run:
    shell: bash
jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # The checkout defaults to $GITHUB_WORKSPACE. Do not set an absolute
      # `path:`: the action resolves it against the workspace and a nested
      # path appears. The next step resolves the workspace for every other one.
      # Credentials stay for the job: the clone is partial (promisor), so the
      # sparse repair below fetches blobs and needs GitHub auth to do it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Resolve workspace
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          # Trust the workspace, but accept a runner that started the step in
          # the real checkout; never trust the current directory blindly.
          if [ ! -f "$workspace/pyproject.toml" ]; then
            fallback="$(git rev-parse --show-toplevel 2>/dev/null || true)"
            if [ -n "$fallback" ] && [ -f "$fallback/pyproject.toml" ]; then
              printf '::warning::GITHUB_WORKSPACE %s holds no checkout; using git root %s\n' "$workspace" "$fallback"
              workspace="$fallback"
            fi
          fi
          repo_root="$(git -C "$workspace" rev-parse --show-toplevel 2>/dev/null || true)"
          printf 'cwd=%s\nworkspace=%s\nrepo_root=%s\nhead=%s\n' \
            "$PWD" "$workspace" "${repo_root:-unresolved}" \
            "$(git -C "$workspace" rev-parse HEAD 2>/dev/null || echo unknown)"
          if [ "$repo_root" != "$workspace" ]; then
            printf '::warning::git root %s differs from GITHUB_WORKSPACE %s; anchoring to the workspace\n' \
              "${repo_root:-none}" "$workspace"
          fi
          # A reused workspace can still have sparse-checkout on
          # from an earlier job; actions/checkout does not clear it, so the tree
          # is materialised only partially. Restore it before testing markers.
          if [ "$(git -C "$workspace" config --bool core.sparseCheckout 2>/dev/null || echo false)" = "true" ]; then
            printf '::warning::workspace checkout is sparse; restoring the full tree\n'
            git_dir="$(git -C "$workspace" rev-parse --absolute-git-dir)"
            sed -n '1,20p' "$git_dir/info/sparse-checkout" 2>/dev/null || true
            # The setting can live in the per-worktree config; clearing only the
            # repository config leaves sparse on and the restore a no-op.
            git -C "$workspace" config --worktree --unset-all core.sparseCheckout 2>/dev/null || true
            rm -f "$git_dir/config.worktree" "$git_dir/info/sparse-checkout"
            git -C "$workspace" config --unset-all extensions.worktreeConfig 2>/dev/null || true
            git -C "$workspace" config --unset-all core.sparseCheckout 2>/dev/null || true
            # Restore only the absent files (keeps local `act` edits) in one
            # checkout, so a partial clone fetches the missing blobs in a single
            # request; then drop the skip-worktree bits.
            missing=()
            while IFS= read -r -d '' file; do
              [ -e "$workspace/$file" ] || missing+=("$file")
            done < <(git -C "$workspace" ls-files -z)
            if [ "${#missing[@]}" -gt 0 ]; then
              git -C "$workspace" checkout --ignore-skip-worktree-bits -- "${missing[@]}"
            fi
            git -C "$workspace" ls-files -z | xargs -0 -r git -C "$workspace" update-index --no-skip-worktree --
          fi
          printf 'tracked_files=%s\n' "$(git -C "$workspace" ls-files | wc -l)"
          for marker in .github/workflows/ci-repo.yml pyproject.toml; do
            if [ -f "$workspace/$marker" ]; then
              printf 'present: %s\n' "$workspace/$marker"
            else
              printf '::error::Missing expected checkout file: %s\n' "$workspace/$marker"
              ls -la "$workspace" || true
              exit 1
            fi
          done
          printf 'WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
      # A Windows/Docker bind mount drops executable bits; restore what git
      # tracks so a local `act` run executes scripts like a Linux runner does.
      - name: Restore executable bits
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          git ls-files -s | awk '$1 == "100755" { print $4 }' | while read -r file; do
            chmod +x "$file"
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned lint tools
        working-directory: ${{ env.WORKSPACE }}
        run: |
          printf '%s\n' \
            'pyflakes==3.4.0 --hash=sha256:f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f' \
            'zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e' \
            > "$RUNNER_TEMP/lint-requirements.txt"
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/lint-requirements.txt"
          pyflakes --version
          zizmor --version
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.11
          fail-on-error: true
      # zizmor's own action runs it through Docker. The binary from the pinned
      # wheel keeps this job working on a runner whose user cannot reach
      # /var/run/docker.sock; same version, same persona, same arguments.
      - name: Run zizmor
        working-directory: ${{ env.WORKSPACE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic --color=always --collect=default .
  test:
    name: Test workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Resolve workspace
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          # Trust the workspace, but accept a runner that started the step in
          # the real checkout; never trust the current directory blindly.
          if [ ! -f "$workspace/pyproject.toml" ]; then
            fallback="$(git rev-parse --show-toplevel 2>/dev/null || true)"
            if [ -n "$fallback" ] && [ -f "$fallback/pyproject.toml" ]; then
              printf '::warning::GITHUB_WORKSPACE %s holds no checkout; using git root %s\n' "$workspace" "$fallback"
              workspace="$fallback"
            fi
          fi
          repo_root="$(git -C "$workspace" rev-parse --show-toplevel 2>/dev/null || true)"
          printf 'cwd=%s\nworkspace=%s\nrepo_root=%s\nhead=%s\n' \
            "$PWD" "$workspace" "${repo_root:-unresolved}" \
            "$(git -C "$workspace" rev-parse HEAD 2>/dev/null || echo unknown)"
          if [ "$repo_root" != "$workspace" ]; then
            printf '::warning::git root %s differs from GITHUB_WORKSPACE %s; anchoring to the workspace\n' \
              "${repo_root:-none}" "$workspace"
          fi
          # A reused workspace can still have sparse-checkout on
          # from an earlier job; actions/checkout does not clear it, so the tree
          # is materialised only partially. Restore it before testing markers.
          if [ "$(git -C "$workspace" config --bool core.sparseCheckout 2>/dev/null || echo false)" = "true" ]; then
            printf '::warning::workspace checkout is sparse; restoring the full tree\n'
            git_dir="$(git -C "$workspace" rev-parse --absolute-git-dir)"
            sed -n '1,20p' "$git_dir/info/sparse-checkout" 2>/dev/null || true
            # The setting can live in the per-worktree config; clearing only the
            # repository config leaves sparse on and the restore a no-op.
            git -C "$workspace" config --worktree --unset-all core.sparseCheckout 2>/dev/null || true
            rm -f "$git_dir/config.worktree" "$git_dir/info/sparse-checkout"
            git -C "$workspace" config --unset-all extensions.worktreeConfig 2>/dev/null || true
            git -C "$workspace" config --unset-all core.sparseCheckout 2>/dev/null || true
            # Restore only the absent files (keeps local `act` edits) in one
            # checkout, so a partial clone fetches the missing blobs in a single
            # request; then drop the skip-worktree bits.
            missing=()
            while IFS= read -r -d '' file; do
              [ -e "$workspace/$file" ] || missing+=("$file")
            done < <(git -C "$workspace" ls-files -z)
            if [ "${#missing[@]}" -gt 0 ]; then
              git -C "$workspace" checkout --ignore-skip-worktree-bits -- "${missing[@]}"
            fi
            git -C "$workspace" ls-files -z | xargs -0 -r git -C "$workspace" update-index --no-skip-worktree --
          fi
          printf 'tracked_files=%s\n' "$(git -C "$workspace" ls-files | wc -l)"
          for marker in pyproject.toml requirements-dev.txt tests/test_workflows.py; do
            if [ -f "$workspace/$marker" ]; then
              printf 'present: %s\n' "$workspace/$marker"
            else
              printf '::error::Missing expected checkout file: %s\n' "$workspace/$marker"
              ls -la "$workspace" || true
              exit 1
            fi
          done
          printf 'WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
      # A Windows/Docker bind mount drops executable bits; restore what git
      # tracks so a local `act` run executes scripts like a Linux runner does.
      - name: Restore executable bits
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          git ls-files -s | awk '$1 == "100755" { print $4 }' | while read -r file; do
            chmod +x "$file"
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ env.WORKSPACE }}/requirements-dev.txt
      - name: Install pinned test dependencies
        working-directory: ${{ env.WORKSPACE }}
        run: python -m pip install --require-hashes -r "$WORKSPACE/requirements-dev.txt"
      - name: Lint and test
        working-directory: ${{ env.WORKSPACE }}
        run: |
          ruff check tests/ scripts/select_scan_targets.py
          ruff format --check tests/ scripts/select_scan_targets.py
          pytest -q
  secrets:
    name: Repository secrets
    uses: ./.github/workflows/profile-secrets.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab needs it.
    with:
      artifact-prefix: repo-secrets
      upload-sarif: false
  security-green:
    name: Security green
    if: always()
    needs: [workflow-lint, test, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all repository checks
        env:
          LINT: ${{ needs.workflow-lint.result }}
          TEST: ${{ needs.test.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          set -euo pipefail
          for result in "$LINT" "$TEST" "$SECRETS"; do test "$result" = success; done

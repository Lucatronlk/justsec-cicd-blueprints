# Run the baseline audit on a schedule, so a repository drifting away from
# BASELINE.md is caught within a week instead of the next time someone thinks
# to run it by hand. Full coverage needs an owner token with admin read on
# every repository in baseline/repos.txt; provide it as BASELINE_AUDIT_TOKEN
# (from Doppler). Without it the run falls back to GITHUB_TOKEN and reports
# UNKNOWN for the settings it cannot read, which the script treats as a
# failure rather than a pass.
name: Baseline audit

on:
  workflow_dispatch:

# One audit at a time: two dispatches would duplicate the API reads and race
# the same caches.
concurrency:
  group: baseline-audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Baseline audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Audit every repository in baseline/repos.txt
        run: python scripts/audit_baseline.py
        env:
          GITHUB_TOKEN: ${{ secrets.BASELINE_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
